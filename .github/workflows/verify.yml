name: Verify unified Play candidate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify unsigned production bundle
        run: bash gradlew clean testReleaseUnitTest lintRelease bundleRelease --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unsigned-play-candidate-and-reports
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
            app/build/test-results/
          retention-days: 14
