name: Verify shared application source
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Test automation
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check both source selections without packaging a release
        run: |
          bash gradlew -Pdistribution=play testReleaseUnitTest lintRelease --console=plain --max-workers=2
          bash gradlew -Pdistribution=customer testReleaseUnitTest lintRelease --console=plain --max-workers=2
